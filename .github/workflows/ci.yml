name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py build
          idf.py size

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32-wifi-killer.bin

  check:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          apt-get update -qq
          apt-get install -y -qq cppcheck

      - name: Check code with cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --suppress=missingInclude \
                   --error-exitcode=1 \
                   main/
